    <!-- Anti-FOUC Theme Script -->
    <script>
      (function() {
        try {
          var savedTheme = localStorage.getItem('erp_theme');
          if (savedTheme) {
            document.documentElement.setAttribute('data-theme', savedTheme);
          } else {
            document.documentElement.setAttribute('data-theme', 'dark'); // Default ERP theme
          }
        } catch (e) {}
      })();
    </script>
